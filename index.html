<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <form method="post">
        <fieldset>
            <legend>Add user</legend>

            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName">

            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName">

            <label for="email">Email address</label>
            <input type="text" id="email" name="email">

            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="guest">Guest</option>
            </select>

            <p>Choose your favourite programming language:</p>

            <input type="radio" id="html" name="favouriteLanguage" value="html">
            <label for="html">HTML</label>

            <input type="radio" id="css" name="favouriteLanguage" value="css">
            <label for="css">CSS</label>

            <input type="radio" id="javascript" name="favouriteLanguage" value="javascript">
            <label for="javascript">JavaScript</label>

            <label for="comments">Comments</label>
            <textarea id="comments" name="comments"></textarea>

            <label for="currentDate">Current date</label>
            <input type="date" id="currentDate" name="currentDate">
        </fieldset>
    </form>
</body>
</html>
